<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma Beauty — U-08, запись</title>
<link rel="stylesheet" href="styles.css"></head><body>
<header class="public-reference-header"><div class="public-header-inner"><a class="cabinet-brand" href="?step=service"><span>Luma<small>BEAUTY</small></span><svg class="cabinet-branch" viewBox="0 0 80 110" fill="none" aria-hidden="true"><path d="M8 105Q42 73 66 7M31 77Q17 55 12 50Q28 55 35 68M39 63Q21 38 21 31Q40 43 44 51M48 43Q35 21 39 15Q51 28 52 33M54 33Q65 13 75 9Q72 25 54 33M46 51Q61 33 76 34Q66 47 46 51M36 69Q53 54 71 61Q56 72 36 69M25 85Q42 76 57 82Q47 89 25 85M61 18Q58 7 64 2Q66 13 61 18" stroke="currentColor" stroke-width="1.1"/><path d="M31 77L14 53M39 63L23 34M48 43L40 18M54 33L72 12M46 51L72 36M36 69L67 62M25 85L53 83" stroke="currentColor" stroke-width=".55"/></svg></a><nav aria-label="Основная навигация"><a href="#">Мастера</a><a href="#">Вдохновение</a><a href="#">Карта</a></nav><div class="public-header-actions"><button aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><a class="account" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>Войти</span></a><button class="public-menu-toggle" aria-label="Открыть меню"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button></div></div></header>
<main class="booking-reference" id="content"></main>
<script>
const params=new URLSearchParams(location.search),salon=params.get('kind')==='salon',step=params.get('step')||'service',state=params.get('state')||'',client=params.get('client')==='1';
const steps=salon?[['service','Услуга'],['master','Мастер'],['time','Время'],['contact','Контакт']]:[['service','Услуга'],['time','Время'],['contact','Контакт']];
const index=steps.findIndex(s=>s[0]===step),venue=salon?'Студия Бьюти':'Анна Морозова',url=s=>'?kind='+(salon?'salon':'master')+'&step='+s;
const action=(label,s,secondary=false)=>`<a class="button ${secondary?'outline':'wine'}" href="${url(s)}">${label}<span aria-hidden="true">${secondary?'':'→'}</span></a>`;
const identity=`<div class="identity"><span class="avatar">${salon?'Б':'А'}</span><div><small>${salon?'САЛОН КРАСОТЫ':'САМОСТОЯТЕЛЬНЫЙ МАСТЕР'}</small><h3>${venue}</h3><p>Новосибирск · Красный проспект, 25</p></div></div>`;
const summary=`<div class="summary-body">${identity}<dl><div><dt>Услуга</dt><dd>${step==='service'?'Выберите услугу':'Маникюр с покрытием'}</dd></div>${salon?`<div><dt>Мастер</dt><dd>${step==='service'?'—':step==='master'?'Выберите мастера':'Мария'}</dd></div>`:''}<div><dt>Длительность</dt><dd>${step==='service'?'—':'90 мин'}</dd></div><div><dt>Дата и время</dt><dd>${(['service','master'].includes(step)||state==='empty')?'Выберите время':'15 октября, 14:00'}</dd></div></dl><div class="total"><span>Стоимость ${salon?'в салоне':'у мастера'}</span><strong>${step==='service'?'—':'2 100 ₽'}</strong></div><p class="privacy">Оплата напрямую ${salon?'в салоне':'мастеру'}.<br>Заявка ожидает подтверждения.</p></div>`;
const progress=`<nav class="progress" aria-label="Шаги записи">${steps.map(([id,label],i)=>`<a href="${url(id)}" class="${i===index?'active':i<index?'done':''}" ${i===index?'aria-current="step"':''}><span>${i<index?'✓':i+1}</span>${label}</a>`).join('')}</nav>`;
const heading=(a,b,p)=>`<div class="step-heading"><span class="eyebrow">ШАГ ${String(index+1).padStart(2,'0')} ИЗ ${steps.length}</span><h1>${a} <em>${b}</em></h1><p>${p}</p></div>`;
const services=['Маникюр с покрытием','Маникюр без покрытия','Снятие покрытия'];
const servicePage=heading('Время для','себя.','Выберите услугу. Цена и длительность указаны '+(salon?'салоном.':'мастером.'))+`<div class="service-list">${services.map((name,i)=>`<a href="${url(salon?'master':'time')}" class="service-row"><div><h3>${name}</h3><p>${[90,60,30][i]} мин</p></div><strong>${['2 100','1 400','500'][i]} ₽</strong><span class="arrow">→</span></a>`).join('')}</div><p class="hint">Запись доступна без аккаунта.</p>`;
const masterPage=heading('К кому','запишемся?','Все мастера оказывают выбранную услугу. Цена и длительность одинаковые.')+`<div class="people"><a href="${url('time')}" class="person any"><span class="avatar small-avatar">✧</span><div><h3>Любой свободный мастер</h3><p>Больше вариантов времени</p></div><span class="arrow">→</span></a>${[['Мария','М'],['Елена','Е'],['Анна','А']].map(([name,letter])=>`<a class="person" href="${url('time')}"><span class="avatar small-avatar">${letter}</span><div><h3>${name}</h3><p>Маникюр · Педикюр</p></div><span class="arrow">→</span></a>`).join('')}</div>`;
const calendar=`<div class="date-time"><section class="calendar"><div class="calendar-title"><h3>Октябрь 2026</h3><div><button aria-label="Предыдущий месяц">‹</button><button aria-label="Следующий месяц">›</button></div></div><div class="dates">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="weekday">${d}</span>`).join('')}${[0,0,0,...Array.from({length:31},(_,i)=>i+1)].map(d=>d?`<button class="${d===15?'selected':d>11&&d<24?'available':''}" aria-label="${d} октября">${d}${d>11&&d<24?'<i></i>':''}</button>`:'<span></span>').join('')}</div><p class="legend"><i></i>Есть свободное время</p></section><section class="times"><span class="eyebrow">ВЫБЕРИТЕ ВРЕМЯ</span><h3>Четверг, 15 октября</h3><div class="hours">${['10:00','11:30','14:00','15:30','17:00','18:30'].map(t=>`<button class="${t==='14:00'?'selected':''}">${t}</button>`).join('')}</div><p>90 минут для вашего визита</p></section></div>`;
const notice=state==='busy'?'<div class="notice" role="alert"><strong>Это время уже занято</strong><p>Выберите другое окно. Введённые имя и контакт сохранены в открытой форме.</p></div>':'';
const timePage=heading('Когда вам','удобно?','Время '+(salon?'салона':'мастера')+' · UTC+7. Выберите дату и свободное окно.')+notice+calendar+`<div class="step-actions">${action('Назад',salon?'master':'service',true)}${action('Продолжить','contact')}</div>`;
const contactPage=heading('Осталось','знакомство.','Оставьте контакт, чтобы '+(salon?'салон':'мастер')+' подтвердил заявку.')+`<form class="contact-form" onsubmit="event.preventDefault();location.href='${url('result')}'"><div class="fields"><label>Как к вам обращаться?<input placeholder="Ваше имя" autocomplete="name" required></label><label>Телефон или Telegram<input placeholder="+7 999 123-45-67 или @username" autocomplete="tel" required></label><label>Комментарий <small>необязательно</small><textarea placeholder="Пожелания к визиту" rows="3"></textarea></label></div><p class="privacy">♧ Контакт ${salon?'увидит владелец салона':'увидит только мастер'}. Регистрация не требуется.</p>${state==='error'?'<div class="notice" role="alert"><strong>Не удалось отправить заявку</strong><p>Проверьте соединение и попробуйте ещё раз. Поля остаются заполненными.</p></div>':''}<div class="step-actions">${action('Назад','time',true)}<button class="button wine" type="submit">Отправить заявку <span>→</span></button></div></form>`;
const emptyPage=heading('Выберем другое','время.','Для этой услуги сейчас нет доступных окон.')+`<div class="empty-panel"><span class="empty-icon">◷</span><h2>Свободных окон пока нет</h2><p>${salon?'Попробуйте выбрать другого мастера или услугу.':'Выберите другую услугу или вернитесь на страницу мастера.'}</p>${action(salon?'Выбрать мастера':'Выбрать услугу',salon?'master':'service')}</div>`;
const resultStatus={confirmed:'Подтверждена',cancelled:'Отменена',done:'Состоялась'}[state]||'Ожидает ответа';
const resultPage=`<div class="result-heading"><span class="eyebrow">ВАША ЛИЧНАЯ ССЫЛКА</span><h1>${state==='cancelled'?'Визит':'Время для'} <em>${state==='cancelled'?'отменён.':'себя.'}</em></h1><p>${state==='confirmed'?'Ваша запись подтверждена.':state==='cancelled'?'Отмена сохранена. Вы можете выбрать новое время.':state==='done'?'Спасибо, что нашли время для себя.':'Заявка отправлена. '+(salon?'Салон':'Мастер')+' свяжется с вами для подтверждения.'}</p></div><article class="result-card"><div class="result-status"><span class="dot ${state}"></span>${resultStatus}</div>${identity}<h2>Маникюр с покрытием</h2><div class="result-facts"><div><span>Дата и время</span><strong>15 октября, 14:00</strong></div><div><span>Длительность</span><strong>90 мин</strong></div><div><span>Стоимость</span><strong>2 100 ₽</strong></div><div><span>Контакт</span><strong>@your_username</strong></div>${salon?'<div><span>Назначенный мастер</span><strong>Мария</strong></div>':''}</div><p class="result-note">Сохраните личную ссылку: по ней можно узнать ответ и отменить активную запись без аккаунта.</p><div class="result-actions"><button class="button wine" onclick="this.textContent='Ссылка скопирована'">Скопировать ссылку <span>↗</span></button>${client?'<button class="button outline">Добавить в мой кабинет</button>':''}${!['cancelled','done'].includes(state)?'<button class="text-button" onclick="document.querySelector(\'dialog\').showModal()">Отменить запись</button>':action('Выбрать новое время','service',true)}</div></article><p class="result-back"><a href="${url('service')}">← На страницу ${salon?'салона':'мастера'}</a></p><dialog><form method="dialog"><h2>Отменить запись?</h2><p>Это время снова станет доступно для других клиентов.</p><div class="step-actions"><button class="button outline">Оставить запись</button><a class="button wine" href="${url('result')}&state=cancelled">Отменить запись</a></div></form></dialog>`;
const invalidPage=`<div class="result-heading"><span class="eyebrow">ЛИЧНАЯ ССЫЛКА</span><h1>Не удалось открыть <em>запись.</em></h1><p>Ссылка недействительна. Если вы сохранили запись в аккаунт, откройте «Моё».</p></div><div class="empty-panel"><h2>Проверьте сохранённую ссылку</h2><p>Вы можете вернуться к специалистам или войти в свой кабинет.</p><div class="step-actions">${action('Найти мастера','service',true)}<a class="button wine" href="#">Войти <span>→</span></a></div></div>`;
document.getElementById('content').innerHTML=step==='result'?`<div class="result-page">${resultPage}</div>`:step==='invalid'?`<div class="result-page">${invalidPage}</div>`:`<a class="back-link" href="${url('service')}">← На страницу ${salon?'салона':'мастера'}</a><div class="booking-top"><span class="eyebrow">ЗАПИСЬ ${salon?'В САЛОН':'К МАСТЕРУ'}</span><p>${venue}</p></div>${progress}<div class="layout"><section class="step-content">${state==='empty'?emptyPage:({service:servicePage,master:masterPage,time:timePage,contact:contactPage}[step]||servicePage)}</section><aside class="summary desktop-summary">${summary}</aside><details class="summary mobile-summary"><summary><span>Ваша запись ${['service','master'].includes(step)?'':'· 2 100 ₽'}</span><span>⌄</span></summary>${summary}</details></div>`;
if(state==='cancel-confirm')document.querySelector('dialog').showModal();
document.querySelectorAll('.hours button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.hours button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
</script></body></html>
