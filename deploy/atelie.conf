server {
    listen 80;
    server_name atelie-13-143-66-1.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/atelie-acme; }
    location / { return 301 https://atelie-13-143-66-1.sslip.io$request_uri; }
}
server {
    listen 443 ssl;
    server_name atelie-13-143-66-1.sslip.io;
    ssl_certificate /etc/letsencrypt/live/atelie-13-143-66-1.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atelie-13-143-66-1.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
